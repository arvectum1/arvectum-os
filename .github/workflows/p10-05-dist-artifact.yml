name: P10.05 dist artifact

on:
  push:
    branches:
      - p10-05-reviewed-generated-output-promotion
    paths:
      - "reference/python/workspace_frontend/**"
      - ".github/workflows/p10-05-dist-artifact.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run typecheck
      - run: npm test
      - run: npm run guard:web-storage
      - run: npm run build
      - name: Commit exact built dist when changed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- reference/python/workspace_frontend/dist; then
            echo "Committed dist is already reproducible."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A reference/python/workspace_frontend/dist
          git commit -m "build(p10.05): reconcile exact frontend dist"
          git push origin HEAD:p10-05-reviewed-generated-output-promotion
      - name: Upload exact built dist
        uses: actions/upload-artifact@v4
        with:
          name: p10-05-workspace-dist
          path: reference/python/workspace_frontend/dist
          if-no-files-found: error
          retention-days: 1
