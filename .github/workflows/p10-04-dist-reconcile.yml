name: P10.04 production asset reconciliation

on:
  push:
    branches:
      - p10-04-company-asset-library
    paths:
      - ".github/workflows/p10-04-dist-reconcile.yml"
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  reconcile:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'build(p10.04): reconcile production assets'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: p10-04-company-asset-library
      - name: Download exact rebuilt dist from validated CI run
        uses: actions/download-artifact@v4
        with:
          name: p10-04-workspace-dist
          path: /tmp/p10-04-workspace-dist
          github-token: ${{ github.token }}
          repository: arvectum1/arvectum-os
          run-id: 33171547052
      - name: Replace committed dist with exact CI artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf reference/python/workspace_frontend/dist
          mkdir -p reference/python/workspace_frontend/dist
          cp -a /tmp/p10-04-workspace-dist/. reference/python/workspace_frontend/dist/
          git diff -- reference/python/workspace_frontend/dist
      - name: Commit reconciled assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/workspace_frontend/dist
          git diff --cached --quiet && exit 0
          git commit -m "build(p10.04): reconcile production assets"
          git push origin HEAD:p10-04-company-asset-library
