name: Productive Workspace CI

on:
  pull_request:
    paths:
      - "reference/python/workspace_app/**"
      - "reference/python/workspace_frontend/**"
      - "reference/python/workspace_tests/**"
      - "reference/python/p9_03_workspace.py"
      - ".github/workflows/workspace-app-ci.yml"
  workflow_dispatch:

# TEMPORARY branch-only materialization for PR #15. This permission and the
# materialization step must be removed before merge; final CI stays read-only.
# Re-triggered after the final F11 owner-usability regression assertions.
permissions:
  contents: write

concurrency:
  group: workspace-app-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: BFF security and context tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python
    steps:
      - name: Check out exact PR head for one-shot dist materialization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: reference/python/workspace_app/requirements-dev.lock
      - name: Install locked BFF test dependencies
        run: python -m pip install --disable-pip-version-check -r workspace_app/requirements-dev.lock
      - name: Compile Workspace Python
        run: python -m compileall -q workspace_app workspace_tests p9_03_workspace.py
      - name: Run Workspace security/context tests
        run: python -m unittest discover -s workspace_tests -v

  frontend:
    name: SPA build, interaction, and storage gates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out exact PR head for one-shot dist materialization
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run frontend tests
        run: npm test
      - name: Reject browser Web Storage
        run: npm run guard:web-storage
      - name: Rebuild production assets
        run: npm run build
      - name: Verify release-pinned production asset boundary
        working-directory: reference/python
        run: python -c 'from pathlib import Path; from workspace_app.assets import verify_frontend_assets; from workspace_app.release import load_release; print(verify_frontend_assets(Path("workspace_frontend"), load_release()))'
      - name: Materialize reproducible dist once on PR branch
        working-directory: .
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- reference/python/workspace_frontend/package-lock.json reference/python/workspace_frontend/dist; then
            echo "dist already reproducible"
            exit 0
          fi
          git config user.name "arvectum-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -- reference/python/workspace_frontend/dist
          if ! git diff --cached --quiet -- reference/python/workspace_frontend/package-lock.json; then
            echo "package-lock changed unexpectedly" >&2
            exit 1
          fi
          git commit -m "build(workspace): materialize p9.11.8 production assets"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
