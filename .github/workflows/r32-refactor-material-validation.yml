name: R32 Material Validation Refactor

on:
  push:
    branches:
      - work/r32-m9-code-health-gate
    paths:
      - ".github/workflows/r32-refactor-material-validation.yml"

permissions:
  contents: write

jobs:
  refactor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/r32-m9-code-health-gate
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Apply exact bounded refactor
        run: python scripts/r32_refactor_material_validation.py
      - name: Compile and run focused regressions
        working-directory: reference/python
        run: |
          python -m compileall -q workspace_app workspace_tests
          python -m unittest workspace_tests.test_company_materials workspace_tests.test_f11_workspace_routes -v
          python tools/workspace_code_health.py
      - name: Verify temporary files removed
        run: |
          test ! -e scripts/r32_refactor_material_validation.py
          test ! -e .github/workflows/r32-refactor-material-validation.yml
          git diff --check
      - name: Commit refactor
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "R32: reduce material validation branching"
          git push origin HEAD:work/r32-m9-code-health-gate
