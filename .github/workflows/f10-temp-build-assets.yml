name: P9.11-F10 temporary production asset rebuild

on:
  push:
    branches:
      - work/p9-11-f10-ru-guidance

permissions:
  contents: write

jobs:
  build-and-commit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact dependencies
        run: npm ci --no-audit --no-fund
      - name: Build exact production assets
        run: npm run build
      - name: Commit rebuilt dist when changed
        working-directory: .
        shell: bash
        run: |
          if git diff --quiet -- reference/python/workspace_frontend/dist; then
            echo "Production assets already match source."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reference/python/workspace_frontend/dist
          git commit -m "P9.11-F10A: rebuild committed Workspace assets"
          git push origin HEAD:work/p9-11-f10-ru-guidance
