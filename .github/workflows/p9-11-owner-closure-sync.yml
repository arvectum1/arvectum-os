name: P9.11 Owner Closure Sync

on:
  push:
    branches:
      - work/p9-11-f11-owner-pass-p9-11-closure
    paths:
      - ".github/workflows/p9-11-owner-closure-sync.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out closure branch
        uses: actions/checkout@v4
        with:
          ref: work/p9-11-f11-owner-pass-p9-11-closure
          fetch-depth: 0

      - name: Apply exact closure transformation
        run: python scripts/p9_11_owner_closure_sync.py

      - name: Verify intended scope
        run: |
          test ! -e .github/workflows/p9-11-owner-closure-sync.yml
          test ! -e scripts/p9_11_owner_closure_sync.py
          git diff --exit-code --check
          git status --short

      - name: Commit closure evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "roadmap: close P9.11 from real owner evidence"
          git push origin HEAD:work/p9-11-f11-owner-pass-p9-11-closure
