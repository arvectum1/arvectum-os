name: R32 M9 Code Health Audit

on:
  push:
    branches:
      - work/r32-m9-code-health-gate
  workflow_dispatch:

permissions:
  contents: read

jobs:
  code-health:
    name: Workspace static/code-health inventory
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Workspace Python
        run: python -m compileall -q workspace_app workspace_tests p9_03_workspace.py tools/workspace_code_health.py
      - name: Run deterministic code-health inventory
        run: python tools/workspace_code_health.py

  python-supply-chain:
    name: Python dependency vulnerability baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Workspace dependencies
        run: python -m pip install --disable-pip-version-check -r workspace_app/requirements-dev.lock
      - name: Verify installed dependency consistency
        run: python -m pip check
      - name: Install audit tool
        run: python -m pip install --disable-pip-version-check pip-audit==2.9.0
      - name: Audit locked Python dependency set
        run: python -m pip_audit -r workspace_app/requirements-dev.lock --strict

  frontend-supply-chain:
    name: Frontend dependency vulnerability baseline
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: reference/python/workspace_frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: reference/python/workspace_frontend/package-lock.json
      - name: Install exact frontend dependencies
        run: npm ci --no-audit --no-fund
      - name: Audit locked frontend dependency set
        run: npm audit --audit-level=high
